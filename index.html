<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoulCare Wellness Audit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --teal-deep:#0A323C; --teal:#0F4C5C; --orange:#E36414; --orange-light:#FB8B24;
  --teal-pale:#E8F1F3; --teal-mid:#B0C8D0; --off-white:#FAFAFA; --ink:#222222; --grey:#E5E7EB;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--ink);background:var(--off-white);line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{background:var(--teal-deep);color:#fff;padding:18px 0}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand-name{font-weight:600;letter-spacing:.14em;font-size:14px;text-transform:uppercase}
.brand-sub{font-size:12px;color:var(--teal-mid);letter-spacing:.04em}
.shell{display:grid;grid-template-columns:250px 1fr;gap:48px;padding:44px 0 72px}
@media(max-width:860px){.shell{grid-template-columns:1fr;gap:26px;padding:28px 0 48px}}
.rail-title{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--teal);font-weight:600;margin-bottom:16px}
.step{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--grey)}
.step:last-child{border-bottom:1px solid var(--grey)}
.step-num{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--teal-mid);width:20px;flex:none;padding-top:2px}
.step-label{font-size:13px;color:#8a9299;line-height:1.4}
.step.done .step-label{color:var(--ink)} .step.done .step-num{color:var(--orange)}
.step.active .step-label{color:var(--teal);font-weight:500} .step.active .step-num{color:var(--teal)}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;color:var(--orange);text-transform:uppercase;margin-bottom:14px}
h1{font-size:29px;font-weight:500;letter-spacing:-.015em;line-height:1.28;color:var(--teal-deep);margin-bottom:10px}
h2{font-size:21px;font-weight:500;letter-spacing:-.01em;color:var(--teal-deep);margin-bottom:12px}
.lede{font-size:16px;color:#4a5257;margin-bottom:28px;max-width:56ch}
.opts{display:flex;flex-direction:column;gap:9px;max-width:640px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--grey);border-radius:8px;padding:14px 16px;font:inherit;font-size:15px;color:var(--ink);cursor:pointer;transition:border-color .13s,background .13s}
.opt:hover{border-color:var(--teal);background:var(--teal-pale)}
.opt:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.fade{animation:fade .38s ease both}
@keyframes fade{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.fade{animation:none}}
.field{margin-bottom:16px;max-width:340px}
label{display:block;font-size:13px;font-weight:500;color:var(--teal);margin-bottom:6px}
.hint{font-size:12px;color:#8a9299;margin-top:5px;line-height:1.45}
input[type=text],input[type=email],input[type=tel],input[type=number]{width:100%;padding:11px 13px;border:1px solid var(--grey);border-radius:8px;font:inherit;font-size:15px;background:#fff;color:var(--ink)}
input:focus{outline:2px solid var(--teal);outline-offset:-1px;border-color:var(--teal)}
.btn{background:var(--orange);color:#fff;border:0;border-radius:8px;padding:13px 26px;font:inherit;font-size:15px;font-weight:500;cursor:pointer;transition:background .13s}
.btn:hover{background:var(--orange-light)}
.btn:focus-visible{outline:2px solid var(--teal-deep);outline-offset:2px}
.btn:disabled{background:var(--teal-mid);cursor:not-allowed}
.btn-ghost{background:none;color:var(--teal);border:1px solid var(--grey);padding:9px 16px;font-size:14px}
.btn-ghost:hover{background:var(--teal-pale);border-color:var(--teal)}
.gauge-row{display:grid;grid-template-columns:310px 1fr;gap:36px;align-items:center;background:#fff;border:1px solid var(--grey);border-radius:12px;padding:28px;margin-bottom:22px}
@media(max-width:860px){.gauge-row{grid-template-columns:1fr;gap:18px;padding:20px}}
.score-num{font-family:'IBM Plex Mono',monospace;font-size:56px;font-weight:500;color:var(--teal-deep);line-height:1;letter-spacing:-.02em}
.score-of{font-family:'IBM Plex Mono',monospace;font-size:18px;color:var(--teal-mid)}
.band{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:5px 11px;border-radius:999px;background:var(--teal-pale);color:var(--teal);margin-top:12px}
.band.priority{background:#FFD9C0;color:#8a3a08}
.pillars{display:flex;flex-direction:column;gap:13px}
.pillar-row{display:grid;grid-template-columns:152px 1fr 40px;gap:12px;align-items:center;font-size:14px}
@media(max-width:520px){.pillar-row{grid-template-columns:1fr;gap:3px}}
.bar{height:7px;background:var(--grey);border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--teal);border-radius:999px;width:0;transition:width .9s cubic-bezier(.2,.7,.2,1)}
.bar span.low{background:var(--orange)}
.pillar-val{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--teal);text-align:right}
.pillar-na{font-size:12px;color:#8a9299;font-style:italic}
.money{background:var(--teal-deep);color:#fff;border-radius:12px;padding:28px;margin-bottom:22px}
.money h2{color:#fff;margin-bottom:6px}
.money .lede{color:var(--teal-mid);margin-bottom:24px}
.money-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:16px;margin-bottom:22px}
@media(max-width:700px){.money-grid{grid-template-columns:1fr}}
.money-cell{background:rgba(255,255,255,.06);border-radius:8px;padding:18px}
.money-label{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--teal-mid);margin-bottom:8px}
.money-val{font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:500;letter-spacing:-.01em;color:var(--orange-light)}
.money-val.sm{font-size:21px;color:#fff}
.money-sub{font-size:12px;color:var(--teal-mid);margin-top:5px}
.dial{border-top:1px solid rgba(255,255,255,.14);padding-top:20px}
.dial-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:12px;flex-wrap:wrap}
.dial-head label{color:#fff;font-size:14px;font-weight:500;margin:0}
.dial-val{font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--orange-light)}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:4px;background:rgba(255,255,255,.2);border-radius:999px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--orange);cursor:pointer;border:3px solid var(--teal-deep)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--orange);cursor:pointer;border:3px solid var(--teal-deep)}
input[type=range]:focus-visible{outline:2px solid var(--orange-light);outline-offset:4px}
.dial-note{font-size:12px;color:var(--teal-mid);margin-top:10px;line-height:1.6}
.workings{margin-top:16px;border-top:1px solid rgba(255,255,255,.14);padding-top:14px}
.workings summary{cursor:pointer;font-size:13px;color:var(--teal-mid);list-style:none}
.workings summary::-webkit-details-marker{display:none}
.workings summary:hover{color:#fff}
.workings-body{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--teal-mid);line-height:1.95;margin-top:11px}
.read{background:#fff;border:1px solid var(--grey);border-left:3px solid var(--orange);padding:22px 24px;margin-bottom:22px}
.read p{font-size:15px;color:#39424a;margin-bottom:11px}
.read p:last-child{margin-bottom:0}
.cta{background:var(--teal-pale);border-radius:12px;padding:28px}
.legal{font-size:12px;color:#6b7479;line-height:1.6;margin-top:16px;max-width:60ch}
.ok{background:#fff;border:1px solid var(--teal-mid);border-radius:12px;padding:28px}
.payload{font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--teal-deep);color:var(--teal-mid);padding:16px;border-radius:8px;white-space:pre-wrap;word-break:break-word;margin-top:14px;line-height:1.7}
footer{border-top:1px solid var(--grey);padding:22px 0;font-size:12px;color:#8a9299}
</style>
</head>
<body>

<header>
  <div class="wrap brand">
    <span class="brand-name">SoulCare&trade; Workplace Solutions</span>
    <span class="brand-sub">Workplace Performance Index</span>
  </div>
</header>

<div class="wrap shell">
  <aside>
    <div class="rail-title">Your audit</div>
    <div id="rail"></div>
  </aside>
  <main id="stage" aria-live="polite"></main>
</div>

<footer>
  <div class="wrap">
    SoulCare&trade; Workplace Solutions Private Limited | CIN U86909AS2026PTC030375 | MSME UDYAM-AS-03-0090984 | souvik@soulcareworkplace.com
  </div>
</footer>

<script>
// Paste your Google Apps Script Web app URL between the quotes to send leads
// straight into SoulCare_WebsiteAudit_Leads. Leave it empty and the page falls
// back to opening a prefilled email to souvik@soulcareworkplace.com.
const ENDPOINT = "";

const BENCHMARK = 72;
const ABSENT_DAYS_BASELINE = 2;
const ABSENT_REDUCTION = 0.10;
const PROD_PER_WPI_POINT = 10 / 12;
const PROD_CAP = 12;
const PROD_REALISATION = 0.25;
const PARTICIPATION_DEFAULT = 50;

const QUESTIONS = [
  { rail:"Body and posture", pillar:"Body and posture",
    q:"In the last six months, how often have employees raised physical discomfort, back or neck pain, or workstation complaints?",
    opts:[["Never, it has not come up",100],["Rarely, one or two mentions",75],["Occasionally, from a few people",50],["Often, it is a recurring theme",25],["Constantly, it is one of our top complaints",0]]},
  { rail:"Movement", pillar:"Energy and movement",
    q:"What proportion of your team takes any structured movement or break during the working day?",
    opts:[["Most of the team, it is built into the day",100],["More than half",75],["About half",50],["A small minority",25],["Almost nobody, people sit straight through",0]]},
  { rail:"Energy", pillar:"Energy and movement",
    q:"How would you describe the energy of your team in the second half of the working day?",
    opts:[["High, output holds up all day",100],["Good, only a mild dip",75],["Mixed, a noticeable afternoon slump",50],["Low, the last two hours are largely unproductive",25],["Very low, people are running on empty",0]]},
  { rail:"Mind and stress", pillar:"Mind and stress",
    q:"How often do you see signs of burnout, disengagement, or people quietly checking out?",
    opts:[["Never",100],["Rarely, isolated cases",75],["Occasionally, in certain teams",50],["Often, across multiple teams",25],["Constantly, and it is affecting delivery",0]]},
  { rail:"Absence", pillar:"Mind and stress",
    q:"What has your absenteeism or sick leave pattern looked like over the last two quarters?",
    opts:[["Below industry norms and stable",100],["Normal and stable",75],["Slightly elevated",50],["Clearly rising",25],["High, rising, and disrupting delivery",0]]},
  { rail:"What exists today", pillar:"Measurement",
    q:"What wellness support exists today, and can you tell whether any of it worked?",
    opts:[["A structured programme, and we measure the outcomes",100],["A structured programme, but we do not measure it",75],["Ad hoc sessions and perks, no measurement",50],["Insurance and an EAP only, nothing active",25],["Nothing in place",0]]}
];
const RAIL_STEPS = QUESTIONS.map(x=>x.rail).concat(["Your organisation","Your result"]);
const state = { step:0, answers:[], employees:null, salary:null, days:22, participation:PARTICIPATION_DEFAULT };

const rupees = n => "Rs. " + Math.round(n).toLocaleString("en-IN");
const el = id => document.getElementById(id);

function drawRail(){
  el("rail").innerHTML = RAIL_STEPS.map((label,i)=>{
    const cls = i<state.step ? "done" : (i===state.step ? "active" : "");
    return '<div class="step '+cls+'"><span class="step-num">'+String(i+1).padStart(2,"0")+'</span><span class="step-label">'+label+'</span></div>';
  }).join("");
}

function render(){
  drawRail();
  if (state.step < QUESTIONS.length) return renderQuestion(state.step);
  if (state.step === QUESTIONS.length) return renderOrg();
  return renderResult();
}

function renderQuestion(i){
  const Q = QUESTIONS[i];
  el("stage").innerHTML =
    '<div class="fade"><div class="eyebrow">Question '+(i+1)+' of '+QUESTIONS.length+'</div>'+
    '<h1>'+Q.q+'</h1>'+
    '<p class="lede">Answer as the person who sees the whole team, not for yourself.</p>'+
    '<div class="opts">'+Q.opts.map(o=>'<button class="opt" data-v="'+o[1]+'">'+o[0]+'</button>').join("")+'</div>'+
    (i>0?'<button class="btn btn-ghost" id="back" style="margin-top:22px">Back</button>':'')+
    '</div>';
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ state.answers[i]=Number(b.dataset.v); state.step++; render(); });
  if (el("back")) el("back").onclick = () => { state.step--; render(); };
}

function renderOrg(){
  el("stage").innerHTML =
    '<div class="fade"><div class="eyebrow">Your organisation</div>'+
    '<h1>Three numbers, and we can price the gap.</h1>'+
    '<p class="lede">These stay on your screen. Nothing is sent anywhere until you choose to send it.</p>'+
    '<div class="field"><label for="emp">Number of employees</label><input id="emp" type="number" min="1" inputmode="numeric" placeholder="250"></div>'+
    '<div class="field"><label for="sal">Average monthly salary, in rupees</label><input id="sal" type="number" min="1" inputmode="numeric" placeholder="60000"><div class="hint">A rough average across the team is fine.</div></div>'+
    '<div class="field"><label for="days">Working days per month</label><input id="days" type="number" min="1" max="31" inputmode="numeric" value="22"></div>'+
    '<button class="btn" id="calc" disabled>Show my result</button>'+
    '<button class="btn btn-ghost" id="back" style="margin-left:8px">Back</button></div>';
  const emp=el("emp"), sal=el("sal"), days=el("days"), calc=el("calc");
  const check=()=>calc.disabled=!(Number(emp.value)>0&&Number(sal.value)>0&&Number(days.value)>0);
  [emp,sal,days].forEach(f=>f.addEventListener("input",check));
  calc.onclick=()=>{ state.employees=Number(emp.value); state.salary=Number(sal.value); state.days=Number(days.value); state.step++; render(); };
  el("back").onclick=()=>{ state.step--; render(); };
}

function compute(){
  const a = state.answers;
  const wpi = Math.round((a[0]+a[1]+a[2]+a[3]+a[4])/5);
  const pillars = [
    { name:"Body and posture", val:a[0] },
    { name:"Energy and movement", val:Math.round((a[1]+a[2])/2) },
    { name:"Mind and stress", val:Math.round((a[3]+a[4])/2) },
    { name:"Lifestyle and nutrition", val:null }
  ];
  const band = wpi>=90?"Platinum":wpi>=85?"Gold":wpi>=75?"Silver":wpi>=60?"Developing":"Priority";
  const gap = Math.max(0, BENCHMARK - wpi);
  const p = state.participation/100;
  const prodPct = Math.min(PROD_CAP, gap*PROD_PER_WPI_POINT);
  const absentPct = Math.min(ABSENT_REDUCTION, ABSENT_REDUCTION*(gap/12));
  const costPerDay = state.salary/state.days;
  const dailyValue = state.employees*costPerDay;
  const daysSaved = state.employees*ABSENT_DAYS_BASELINE*absentPct*p;
  const absentValue = daysSaved*costPerDay;
  const prodGross = dailyValue*(prodPct/100)*state.days;
  const prodValue = prodGross*p*PROD_REALISATION;
  const monthly = absentValue+prodValue;
  const annual = monthly*12;
  const payrollAnnual = state.employees*state.salary*12;
  return { wpi, pillars, band, gap, prodPct, absentPct, costPerDay, dailyValue, daysSaved,
           absentValue, prodGross, prodValue, monthly, annual, payrollAnnual,
           perEmployee: annual/state.employees,
           payrollPct: payrollAnnual>0 ? (annual/payrollAnnual)*100 : 0,
           maturity: a[5] };
}

function gaugeSVG(wpi){
  const cx=160, cy=150, r=118, len=Math.PI*r;
  const pt=(v,rad)=>{const a=(180-(v/100)*180)*Math.PI/180;return [cx+rad*Math.cos(a), cy-rad*Math.sin(a)];};
  const n=pt(wpi,92), b1=pt(BENCHMARK,r+11), b2=pt(BENCHMARK,r-11), bt=pt(BENCHMARK,r+26);
  const off=len*(1-wpi/100);
  return '<svg viewBox="0 0 320 205" width="100%" role="img" aria-label="Indicative WPI of '+wpi+' out of 100 against an industry benchmark of '+BENCHMARK+'">'+
  '<path d="M '+(cx-r)+','+cy+' A '+r+','+r+' 0 0 1 '+(cx+r)+','+cy+'" fill="none" stroke="#E5E7EB" stroke-width="13" stroke-linecap="round"/>'+
  '<path d="M '+(cx-r)+','+cy+' A '+r+','+r+' 0 0 1 '+(cx+r)+','+cy+'" fill="none" stroke="'+(wpi<BENCHMARK?'#E36414':'#0F4C5C')+'" stroke-width="13" stroke-linecap="round" stroke-dasharray="'+len+'" stroke-dashoffset="'+len+'">'+
  '<animate attributeName="stroke-dashoffset" from="'+len+'" to="'+off+'" dur="1.1s" fill="freeze" calcMode="spline" keySplines="0.2 0.7 0.2 1"/></path>'+
  '<line x1="'+b1[0]+'" y1="'+b1[1]+'" x2="'+b2[0]+'" y2="'+b2[1]+'" stroke="#0A323C" stroke-width="2"/>'+
  '<text x="'+bt[0]+'" y="'+bt[1]+'" font-family="IBM Plex Mono, monospace" font-size="11" fill="#0A323C" text-anchor="middle">'+BENCHMARK+'</text>'+
  '<line x1="'+cx+'" y1="'+cy+'" x2="'+n[0]+'" y2="'+n[1]+'" stroke="#0A323C" stroke-width="2.5" stroke-linecap="round"/>'+
  '<circle cx="'+cx+'" cy="'+cy+'" r="6" fill="#0A323C"/>'+
  '<text x="34" y="176" font-family="IBM Plex Mono, monospace" font-size="11" fill="#B0C8D0">0</text>'+
  '<text x="286" y="176" font-family="IBM Plex Mono, monospace" font-size="11" fill="#B0C8D0">100</text></svg>';
}

function fallbackRead(r){
  const weakest = r.pillars.filter(p=>p.val!==null).sort((a,b)=>a.val-b.val)[0];
  const mat = r.maturity<=50
    ? "You also told us nothing in place today is measured. That is the part that compounds. Without a baseline, no wellness spend can be defended at renewal, and no improvement can be proven."
    : "You do have something in place. The question a finance director will ask is whether you can prove it moved anything.";
  return [
    "An indicative score of "+r.wpi+" puts you in the "+r.band+" band, "+(r.gap>0?r.gap+" points below the "+BENCHMARK+" benchmark":"at or above the "+BENCHMARK+" benchmark")+". Your weakest signal is "+weakest.name.toLowerCase()+".",
    mat,
    "This is an estimate built from six questions you answered about your team. The measured WPI comes from an anonymous twenty question survey of your employees, covering all four pillars. That is the number you can take to your board."
  ];
}

async function aiRead(r, box){
  const weakest = r.pillars.filter(p=>p.val!==null).sort((a,b)=>a.val-b.val)[0];
  try{
    const res = await fetch("/api/interpret",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        wpi:r.wpi, band:r.band,
        body:r.pillars[0].val, movement:r.pillars[1].val, mind:r.pillars[2].val,
        weakest:weakest.name, maturity:r.maturity,
        employees:state.employees, monthly:Math.round(r.monthly)
      })
    });
    if(!res.ok) throw new Error("api");
    const data = await res.json();
    if(!data.text) throw new Error("empty");
    box.innerHTML = data.text.split(/\n\s*\n/).map(p=>'<p>'+p.replace(/</g,"&lt;")+'</p>').join("");
  }catch(e){
    box.innerHTML = fallbackRead(r).map(p=>'<p>'+p+'</p>').join("");
  }
}

function moneyHTML(r){
  return '<div class="money-grid">'+
    '<div class="money-cell"><div class="money-label">Value at stake, per month</div><div class="money-val" id="mMonthly">'+rupees(r.monthly)+'</div><div class="money-sub" id="mAnnual">'+rupees(r.annual)+' a year</div></div>'+
    '<div class="money-cell"><div class="money-label">Per employee, per year</div><div class="money-val sm" id="mPer">'+rupees(r.perEmployee)+'</div></div>'+
    '<div class="money-cell"><div class="money-label">Share of your payroll</div><div class="money-val sm" id="mPct">'+r.payrollPct.toFixed(1)+'%</div></div>'+
  '</div>';
}

function workingsHTML(r){
  return 'Cost per day = '+rupees(state.salary)+' / '+state.days+' = '+rupees(r.costPerDay)+'<br>'+
  'Daily workforce value = '+state.employees+' x '+rupees(r.costPerDay)+' = '+rupees(r.dailyValue)+'<br><br>'+
  'ABSENTEEISM<br>'+
  'Baseline '+ABSENT_DAYS_BASELINE+' days per employee per month<br>'+
  'Reduction '+(r.absentPct*100).toFixed(1)+'%, scaled to your '+r.gap+' point gap<br>'+
  'Participation '+state.participation+'%<br>'+
  'Days saved = '+r.daysSaved.toFixed(1)+' &nbsp;|&nbsp; Value = '+rupees(r.absentValue)+'<br><br>'+
  'PRODUCTIVITY<br>'+
  'Gap '+r.gap+' points x 0.83% per point, capped at '+PROD_CAP+'% = '+r.prodPct.toFixed(1)+'%<br>'+
  'Theoretical value = '+rupees(r.prodGross)+'<br>'+
  'x participation '+state.participation+'% x realisation '+(PROD_REALISATION*100)+'% = '+rupees(r.prodValue)+'<br><br>'+
  'TOTAL PER MONTH = '+rupees(r.monthly);
}

function renderResult(){
  let r = compute();
  el("stage").innerHTML =
  '<div class="fade">'+
  '<div class="eyebrow">Indicative result</div>'+
  '<h1>Your estimated Workplace Performance Index</h1>'+
  '<p class="lede">Built from your six answers. This is an estimate, not a measurement.</p>'+
  '<div class="gauge-row"><div>'+gaugeSVG(r.wpi)+
  '<div style="text-align:center;margin-top:-4px"><span class="score-num">'+r.wpi+'</span><span class="score-of"> / 100</span><br>'+
  '<span class="band '+(r.wpi<60?'priority':'')+'">'+r.band+'</span></div></div>'+
  '<div class="pillars">'+r.pillars.map(p=>
    '<div class="pillar-row"><div>'+p.name+'</div>'+
    (p.val===null
      ? '<div class="pillar-na">Cannot be seen from the outside</div><div></div>'
      : '<div class="bar"><span class="'+(p.val<BENCHMARK?'low':'')+'" data-w="'+p.val+'"></span></div><div class="pillar-val">'+p.val+'</div>')+
    '</div>').join("")+'</div></div>'+

  '<div class="read" id="read"><p style="color:#8a9299">Reading your result...</p></div>'+

  '<div class="money"><h2>What the gap is worth</h2>'+
  '<p class="lede">On your numbers: '+state.employees+' employees, '+rupees(state.salary)+' average monthly salary, '+state.days+' working days.</p>'+
  '<div id="moneyGrid">'+moneyHTML(r)+'</div>'+
  '<div class="dial">'+
    '<div class="dial-head"><label for="part">What share of your team would actually take part?</label><span class="dial-val" id="partVal">'+state.participation+'%</span></div>'+
    '<input type="range" id="part" min="10" max="100" step="5" value="'+state.participation+'">'+
    '<p class="dial-note">Value only reaches people who engage. Set this to whatever you honestly believe, not what you hope. We then keep only 25 percent of the theoretical productivity gain, because an hour of recovered focus is not worth an hour of salary.</p>'+
  '</div>'+
  '<details class="workings"><summary>Show the workings</summary><div class="workings-body" id="workings">'+workingsHTML(r)+'</div></details>'+
  '</div>'+

  '<div class="cta" id="cta"><h2>Get the measured number</h2>'+
  '<p class="lede">A complimentary Wellness Audit review with our founder. Fifteen minutes, walking through what your real WPI would take to establish and what it is likely to show.</p>'+
  '<div class="field"><label for="n">Your name</label><input id="n" type="text" autocomplete="name"></div>'+
  '<div class="field"><label for="e">Work email</label><input id="e" type="email" autocomplete="email"></div>'+
  '<div class="field"><label for="c">Company</label><input id="c" type="text" autocomplete="organization"></div>'+
  '<div class="field"><label for="p">Phone, optional</label><input id="p" type="tel" autocomplete="tel"></div>'+
  '<button class="btn" id="send" disabled>Book my Wellness Audit</button>'+
  '<p class="legal">Your answers stay anonymous. We store your contact details only to arrange this call, and we never share individual employee responses with an employer. Ask us to delete your details at any time by writing to souvik@soulcareworkplace.com.</p></div>'+

  '<div style="margin-top:22px"><button class="btn btn-ghost" id="again">Start again</button></div></div>';

  requestAnimationFrame(()=>document.querySelectorAll(".bar span").forEach(b=>b.style.width=b.dataset.w+"%"));
  aiRead(r, el("read"));

  const part = el("part");
  part.addEventListener("input", ()=>{
    state.participation = Number(part.value);
    el("partVal").textContent = state.participation+"%";
    r = compute();
    el("mMonthly").textContent = rupees(r.monthly);
    el("mAnnual").textContent = rupees(r.annual)+" a year";
    el("mPer").textContent = rupees(r.perEmployee);
    el("mPct").textContent = r.payrollPct.toFixed(1)+"%";
    el("workings").innerHTML = workingsHTML(r);
  });

  const n=el("n"), e=el("e"), c=el("c"), p=el("p"), send=el("send");
  const valid=()=>n.value.trim() && /\S+@\S+\.\S+/.test(e.value) && c.value.trim();
  [n,e,c].forEach(f=>f.addEventListener("input",()=>send.disabled=!valid()));
  send.onclick=()=>submitLead(compute(),{name:n.value.trim(),email:e.value.trim(),company:c.value.trim(),phone:p.value.trim()});
  el("again").onclick=()=>{ state.step=0; state.answers=[]; state.participation=PARTICIPATION_DEFAULT; render(); };
}

function submitLead(r, contact){
  const lead = {
    source:"Website Wellness Audit",
    captured_at:new Date().toISOString(),
    name:contact.name, work_email:contact.email, company:contact.company, phone:contact.phone||"not given",
    employees:state.employees, avg_monthly_salary:state.salary, working_days:state.days,
    participation_assumed_pct:state.participation,
    indicative_wpi:r.wpi, band:r.band, gap_to_benchmark:r.gap,
    pillar_body_posture:r.pillars[0].val,
    pillar_energy_movement:r.pillars[1].val,
    pillar_mind_stress:r.pillars[2].val,
    measurement_maturity:r.maturity,
    value_at_stake_monthly_rs:Math.round(r.monthly),
    value_at_stake_annual_rs:Math.round(r.annual),
    share_of_payroll_pct:Number(r.payrollPct.toFixed(2)),
    answers:state.answers
  };
  const body = Object.entries(lead).map(([k,v])=>k+": "+(Array.isArray(v)?v.join(", "):v)).join("\n");
  const mailto = "mailto:souvik@soulcareworkplace.com?subject="+encodeURIComponent("Wellness Audit lead: "+contact.company+" (WPI "+r.wpi+")")+"&body="+encodeURIComponent(body);

  if (ENDPOINT) {
    fetch(ENDPOINT, { method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain"}, body:JSON.stringify(lead) })
      .catch(()=>{ window.location.href = mailto; });
    el("cta").outerHTML =
      '<div class="ok fade"><h2>Booked. We will be in touch within one working day.</h2>'+
      '<p class="lede">Our founder will call to walk you through what the measured WPI would show for '+contact.company+'.</p></div>';
    return;
  }

  el("cta").outerHTML =
    '<div class="ok fade"><h2>Booked. We will be in touch within one working day.</h2>'+
    '<p class="lede">Our founder will call to walk you through what the measured WPI would show for '+contact.company+'.</p>'+
    '<a class="btn" style="display:inline-block;text-decoration:none" href="'+mailto+'">Send this to SoulCare&trade;</a>'+
    '<details class="workings" style="border:0;margin-top:18px"><summary style="color:#6b7479">Show the lead record</summary>'+
    '<div class="payload">'+JSON.stringify(lead,null,2).replace(/</g,"&lt;")+'</div></details>'+
    '<p class="legal">Developer note: POST this JSON to the Lead Pipeline endpoint. Until that is wired, the button opens a prefilled email to souvik@soulcareworkplace.com.</p></div>';
}

render();
</script>
</body>
</html>
